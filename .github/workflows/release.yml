name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python export deps
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install timm transformers onnx onnxruntime pillow numpy

      - name: Export ONNX weights
        run: |
          mkdir -p pwa/model
          python scripts/export_bvra_onnx.py
          python scripts/export_dima806_onnx.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Copy models to dist
        run: node scripts/copy-models-to-dist.cjs

      - name: Verify dist assets
        run: pnpm verify:dist

      - name: Verify labels/knowledge
        run: pnpm verify:labels

      - name: Smoke-test inference shapes
        run: pnpm verify:inference

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "foragerflow-${{ github.ref_name }}.tar.gz" -C dist .
          gh release upload "${{ github.ref_name }}" "foragerflow-${{ github.ref_name }}.tar.gz" --clobber
