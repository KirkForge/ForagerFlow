name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # ponytail: gates #14 — required reviewers / wait timer are configured in
    # repo Settings → Environments → "production". The environment reference
    # alone enforces whatever protection rules exist there.
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python export deps
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install timm transformers onnx onnxruntime pillow numpy

      - name: Export ONNX weights
        run: |
          mkdir -p pwa/model
          python scripts/export_bvra_onnx.py
          python scripts/export_dima806_onnx.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: pnpm build

      - name: Copy models to dist
        run: node scripts/copy-models-to-dist.cjs

      - name: Verify dist assets
        run: pnpm verify:dist

      - name: Verify labels/knowledge
        run: pnpm verify:labels

      - name: Smoke-test inference shapes
        run: pnpm verify:inference

      - name: Inference latency gate (p95 < 2500ms on CPU)
        run: |
          python3 scripts/test-latency.py \
            pwa/model/fungitastic.onnx \
            pwa/model/fungitastic-classes.json \
            test-images \
            2500 \
            --warmup 3 \
            --runs 20

      - name: Upload latency artifact
        uses: actions/upload-artifact@v4
        with:
          name: latency-results
          path: latency-results.json
          retention-days: 30

      - name: Generate assetlinks for TWA
        env:
          TWA_HOST: ${{ vars.TWA_HOST }}
          TWA_SHA256_FINGERPRINT: ${{ secrets.TWA_SHA256_FINGERPRINT }}
        run: node scripts/generate-assetlinks.cjs

      - name: Set up JDK for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build TWA APK
        env:
          TWA_HOST: ${{ vars.TWA_HOST }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: node scripts/build-twa.cjs

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Generate SBOM (CycloneDX)  # gap #11
        run: |
          syft . -o cyclonedx-json --file "foragerflow-${{ github.ref_name }}-sbom.json"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "foragerflow-${{ github.ref_name }}.tar.gz" -C dist .
          gh release upload "${{ github.ref_name }}" \
            "foragerflow-${{ github.ref_name }}.tar.gz" \
            "dist/twa/foragerflow-release-unsigned.apk" \
            "foragerflow-${{ github.ref_name }}-sbom.json" \
            --clobber

      # ── gap #5: APK signing + Play Console upload ───────────────────────────
      # Defensive: every step below is gated on the signing keystore secret
      # being present, so a release with no secrets configured behaves exactly
      # as before (unsigned APK + tar + SBOM already uploaded above). To enable
      # signing + Play upload, set these repo secrets:
      #   ANDROID_KEYSTORE_BASE64    base64-encoded .keystore / .jks
      #   ANDROID_KEYSTORE_PASSWORD  keystore password
      #   ANDROID_KEY_ALIAS          key alias
      #   ANDROID_KEY_PASSWORD       key password
      #   PLAY_SERVICE_ACCOUNT_JSON  Play Console service account JSON (Play only)
      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/foragerflow.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/foragerflow.keystore" >> "$GITHUB_ENV"

      - name: Sign APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # ponytail: apksigner ships in Android build-tools; pick the newest.
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$APKSIGNER" || { echo "apksigner not found"; exit 1; }
          UNSIGNED="dist/twa/foragerflow-release-unsigned.apk"
          SIGNED="dist/twa/foragerflow-release-signed.apk"
          cp "$UNSIGNED" "$SIGNED"
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            "$SIGNED"
          "$APKSIGNER" verify --print-certs "$SIGNED" | head -5

      - name: Attach signed APK to release
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "dist/twa/foragerflow-release-signed.apk" --clobber

      - name: Write Play service account key
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-sa.json"
          echo "PLAY_SA_PATH=$RUNNER_TEMP/play-sa.json" >> "$GITHUB_ENV"

      - name: Upload to Google Play (internal track)
        if: ${{ env.PLAY_SA_PATH != '' }}
        uses: google-github-actions/upload-to-play@v1
        with:
          serviceAccountJson: ${{ env.PLAY_SA_PATH }}
          packageName: com.kirkforge.foragerflow
          releaseFiles: dist/twa/foragerflow-release-signed.apk
          track: internal
