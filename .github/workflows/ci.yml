name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test:ci

      - name: Build
        run: pnpm build

      - name: Verify dist assets
        run: pnpm verify:dist

      - name: Verify labels/knowledge
        run: pnpm verify:labels

      - name: Generate TWA assetlinks placeholder
        env:
          TWA_HOST: ${{ vars.TWA_HOST }}
        run: node scripts/generate-assetlinks.cjs

      - name: Verify TWA skeleton files exist
        run: |
          test -f twa/app/build.gradle.kts
          test -f twa/app/src/main/AndroidManifest.xml
          test -x twa/gradlew

      - name: Verify TWA host placeholder not in source
        run: |
          # The source twa-config.xml must not contain the example domain.
          # build-twa.cjs generates the real config from TWA_HOST at build time.
          if grep -q "foragerflow.example.com" twa/app/src/main/res/values/twa-config.xml; then
            echo "ERROR: foragerflow.example.com found in twa-config.xml source"
            exit 1
          fi
          # The only foragerflow.example.com reference in twa/ should be the
          # Gradle buildConfigField fallback in build.gradle.kts.
          count=$(grep -rn "foragerflow.example.com" twa/ --include="*.kts" --include="*.xml" --include="*.java" | grep -v "build.gradle.kts" | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "ERROR: foragerflow.example.com found outside build.gradle.kts fallback"
            exit 1
          fi

      - name: Install Playwright browsers and dependencies
        run: |
          pnpm exec playwright install chromium firefox webkit
          pnpm exec playwright install-deps chromium firefox webkit

      - name: End-to-end tests (Chromium + Firefox)
        run: pnpm e2e:ci

      # WebKit is slower to launch and the axe-core scan can be heavy, so run it
      # single-worker to avoid flaky timeouts in GitHub Actions runners.
      - name: End-to-end tests (WebKit)
        run: pnpm exec playwright test --project=webkit --workers=1

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

      - name: Secret scan
        run: trufflehog filesystem . --only-verified --no-update --exclude-paths=.trufflehog-exclude.txt --fail

      - name: Audit
        run: pnpm audit --audit-level high

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Backend typecheck
        run: pnpm --filter @foragerflow/backend typecheck

      - name: Backend test
        run: pnpm --filter @foragerflow/backend test
