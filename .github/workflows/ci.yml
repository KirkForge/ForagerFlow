name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test:ci

      - name: Build
        run: pnpm build

      - name: Verify dist assets
        run: pnpm verify:dist

      - name: Verify labels/knowledge
        run: pnpm verify:labels

      - name: Generate TWA assetlinks placeholder
        run: node scripts/generate-assetlinks.cjs

      - name: Verify TWA skeleton files exist
        run: |
          test -f twa/app/build.gradle.kts
          test -f twa/app/src/main/AndroidManifest.xml
          test -x twa/gradlew

      - name: Install Playwright browsers and dependencies
        run: |
          pnpm exec playwright install chromium firefox webkit
          pnpm exec playwright install-deps chromium firefox webkit

      - name: End-to-end tests (Chromium + Firefox)
        run: pnpm e2e:ci

      - name: End-to-end tests (WebKit)
        run: pnpm exec playwright test --project=webkit

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

      - name: Secret scan
        run: trufflehog filesystem . --only-verified --no-update --exclude-paths=.trufflehog-exclude.txt --fail

      - name: Audit
        run: pnpm audit --audit-level high
